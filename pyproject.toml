[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagin"
version = "3.0.0"
authors = [
  { name="Andrey Sukhanov", email="sukhanov@bnl.gov" },
]
description = "Interactive viewer and analyzer for streamed images"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy<2",
  "Pillow>=8",
  "PyQt5>=5.15",
  "pyqtgraph>=0.14",
  "scipy>=1.11.4",
]

[project.optional-dependencies]
http = [
  "requests>=2",
]
epics = [
  "caproto",
]
pva = [
  "p4p",
]
usb = [
  "opencv-python",
]
all = [
  "caproto",
  "opencv-python",
  "p4p",
  "requests>=2",
]

[project.urls]
"Homepage" = "https://github.com/ASukhanov/imagin"
"Bug Tracker" = "https://github.com/ASukhanov/imagin"
